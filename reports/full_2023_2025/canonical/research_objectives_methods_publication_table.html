<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mapping of research objectives to analytical methods</title>
  <style>
@page { size: A4 landscape; margin: 18mm 20mm 17mm; }
* { box-sizing: border-box; }
html { background: #fff; }
body {
  max-width: 257mm;
  margin: 0 auto;
  color: #111;
  background: #fff;
  font-family: Georgia, "Times New Roman", serif;
  font-size: 10.5pt;
  line-height: 1.32;
  -webkit-print-color-adjust: exact;
  print-color-adjust: exact;
}
figure { margin: 0; }
figcaption {
  margin: 0 0 4mm;
  font-size: 11pt;
  line-height: 1.25;
}
.table-number {
  display: inline;
  color: #111;
  font-weight: 700;
  -webkit-text-fill-color: #111;
}
.table-title { font-style: italic; }
table {
  width: 100%;
  border-collapse: collapse;
  table-layout: fixed;
  border-top: 1.4pt solid #111;
  border-bottom: 1.4pt solid #111;
}
thead { display: table-header-group; }
thead tr { border-bottom: 0.8pt solid #111; }
tbody tr + tr { border-top: 0.35pt solid #aaa; }
tr { break-inside: avoid; }
th, td {
  border: 0;
  padding: 2.7mm 3.2mm;
  text-align: left;
  vertical-align: top;
  overflow-wrap: break-word;
  hyphens: auto;
}
th {
  font-weight: 700;
  vertical-align: bottom;
}
.notes {
  margin: 3mm 0 0;
  font-size: 8.7pt;
  line-height: 1.3;
}
.notes-label { font-style: italic; }
.objectives col:first-child { width: 47%; }
.objectives col:last-child { width: 53%; }
.inputs col:nth-child(1) { width: 18%; }
.inputs col:nth-child(2) { width: 14%; }
.inputs col:nth-child(3) { width: 19%; }
.inputs col:nth-child(4) { width: 25%; }
.inputs col:nth-child(5) { width: 24%; }
.sample col:nth-child(1) { width: 61%; }
.sample col:nth-child(2) { width: 14%; }
.sample col:nth-child(3) { width: 25%; }
.sample th:nth-child(2), .sample td:nth-child(2) {
  text-align: right;
  white-space: nowrap;
}
@media screen {
  body { padding: 18mm 20mm; box-shadow: 0 0 10px #ccc; min-height: 210mm; }
}
@media print {
  body { max-width: none; }
}
</style>
</head>
<body>
  <figure>
    <figcaption><span class="table-number">Table X.</span>
      <span class="table-title">Mapping of research objectives to analytical methods</span></figcaption>
    <table class='objectives'><colgroup><col><col></colgroup><thead><tr><th scope='col'>Research objective</th><th scope='col'>Analytical method</th></tr></thead><tbody><tr><td>Identify which technologies and balancing mechanism units (BMUs) are marginal.</td><td>ISPStack reconstruction and marginal-action identification algorithm.</td></tr><tr><td>Compare bids, offers and system conditions, and describe their evolution over the study period.</td><td>Net imbalance volume (NIV)-conditioned descriptive analysis, stratified by action side and year.</td></tr><tr><td>Examine how BMU identity relates to the system price.</td><td>Side-specific random-forest regression with SHAP-based model interpretation.</td></tr><tr><td>Measure the concentration of BMU-level marginal occurrence and SHAP importance.</td><td>Herfindahl–Hirschman indices (HHIs) of marginal-setting shares and cumulative SHAP-importance coverage metrics.</td></tr><tr><td>Assess whether battery participation and price-forming importance evolved together, including under system-long and system-short conditions.</td><td>Separate annual random-forest models and comparative SHAP analysis by system direction.</td></tr></tbody></table>
    <p class="notes"><span class="notes-label">Note.</span> BMU = balancing mechanism unit; HHI = Herfindahl–Hirschman index; NIV = net imbalance volume; SHAP = Shapley additive explanations.</p>
  </figure>
</body>
</html>
